      - name: Test 9 — Debug Railway DB Connectivity
        run: |
          echo "Testing $RAILWAY_URL/debug/railway..."
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/railway" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok": false, "message": "Request failed"}')
          echo "$RESPONSE" | jq '.'
          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          if [ "$OK" = "true" ]; then
            echo "PASS: Railway PostgreSQL connection works from the app."
          else
            echo "WARN: Railway PostgreSQL connection failed."
            echo "Common causes: RAILWAY_DB_URL env var not set, or Railway DB is down."
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  LIVE RAILWAY SMOKE TEST SUMMARY"
          echo "============================================"
          echo "Railway URL: $RAILWAY_URL"
          echo ""
          echo "NOTES:"
          echo "- /debug/tcp, /debug/odbc, /debug/sql may fail if your on-prem SQL Server"
          echo "  does not allow connections from Railway's cloud IPs. This is expected."
          echo "- /test-sharepoint may fail if SharePoint app registration permissions"
          echo "  are not granted or the client secret is expired."
          echo "- /extract/sql depends on SQL Server connectivity from Railway."
          echo "- /debug/railway depends on Railway DB connectivity from the app."
          echo ""
          echo "For full connectivity, ensure:"
          echo "  1. Railway environment variables are configured in Railway dashboard."
          echo "  2. On-prem SQL Server firewall allows Railway outbound IPs."
          echo "  3. SharePoint app has 'Sites.Read.All' and 'Files.Read.All' permissions."
          echo "============================================"
