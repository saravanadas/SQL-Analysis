name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t unified-mcp .

  railway-smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      RAILWAY_URL: https://web-production-34c87.up.railway.app
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Railway deployment
        run: sleep 60

      - name: Test 1 — Health Check
        run: |
          curl -sf "$RAILWAY_URL/health" || curl -sf "$RAILWAY_URL/"

      - name: Test 2 — MCP Tools Registered
        run: |
          curl -sf "$RAILWAY_URL/debug/tools" -H "Authorization: Bearer $API_TOKEN"

      - name: Test 3 — SharePoint Auth
        run: |
          curl -sf "$RAILWAY_URL/test-sharepoint" -H "Authorization: Bearer $API_TOKEN"

      - name: Test 4 — Railway DB Connectivity
        run: |
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/railway" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok":false}')
          echo "$RESPONSE" | jq '.'

      - name: Test 5 — SQL Server TCP Reachable
        run: |
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/tcp" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok":false}')
          echo "$RESPONSE" | jq '.'

      - name: Test 6 — SQL Server ODBC
        run: |
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/odbc" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok":false}')
          echo "$RESPONSE" | jq '.'
          echo "NOTE: ODBC may timeout if SQL Server firewall blocks Railway IPs."

      - name: Test 7 — SQL Server Query
        run: |
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/sql" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok":false}')
          echo "$RESPONSE" | jq '.'

      - name: Test 8 — Extract SQL Job Initiation
        run: |
          RESPONSE=$(curl -sf "$RAILWAY_URL/extract/sql" -X POST -H "Authorization: Bearer $API_TOKEN" || echo '{"ok":false}')
          echo "$RESPONSE" | jq '.'

      - name: Test 9 — Debug Railway DB Connectivity
        run: |
          echo "Testing $RAILWAY_URL/debug/railway..."
          RESPONSE=$(curl -sf "$RAILWAY_URL/debug/railway" -H "Authorization: Bearer $API_TOKEN" || echo '{"ok": false, "message": "Request failed"}')
          echo "$RESPONSE" | jq '.'
          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          if [ "$OK" = "true" ]; then
            echo "PASS: Railway PostgreSQL connection works from the app."
          else
            echo "WARN: Railway PostgreSQL connection failed."
            echo "Common causes: RAILWAY_DB_URL env var not set, or Railway DB is down."
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  LIVE RAILWAY SMOKE TEST SUMMARY"
          echo "============================================"
          echo "Railway URL: $RAILWAY_URL"
          echo ""
          echo "NOTES:"
          echo "- /debug/tcp, /debug/odbc, /debug/sql may fail if your on-prem SQL Server"
          echo "  does not allow connections from Railway's cloud IPs. This is expected."
          echo "- /test-sharepoint may fail if SharePoint app registration permissions"
          echo "  are not granted or the client secret is expired."
          echo "- /extract/sql depends on SQL Server connectivity from Railway."
          echo "- /debug/railway depends on Railway DB connectivity from the app."
          echo ""
          echo "For full connectivity, ensure:"
          echo "  1. Railway environment variables are configured in Railway dashboard."
          echo "  2. On-prem SQL Server firewall allows Railway outbound IPs."
          echo "  3. SharePoint app has 'Sites.Read.All' and 'Files.Read.All' permissions."
          echo "============================================"
